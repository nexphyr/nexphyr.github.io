<!DOCTYPE html>
<html lang="id" manifest="cache.appcache">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXPHYRIX :: PS4 Exploit v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --void: #020a14;
      --panel: #040d1a;
      --line: #0a2540;
      --blue: #00b4ff;
      --blue-dim: #0a4a7a;
      --blue-glow: rgba(0, 180, 255, 0.45);
      --cyan-ghost: #00fff7;
      --violet-ghost: #7b2fff;
      --ink: #c9daf0;
      --ink-dim: #3a5a7a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--void);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      text-align: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(0, 180, 255, 0.10), transparent 55%),
        linear-gradient(rgba(0, 180, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 180, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 42px 42px, 42px 42px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px,
          rgba(0, 180, 255, 0.02) 2px, rgba(0, 180, 255, 0.02) 4px);
      mix-blend-mode: screen;
    }

    .hud-frame {
      position: fixed;
      inset: 10px;
      z-index: 2;
      pointer-events: none;
      border: 1px solid rgba(0, 180, 255, 0.15);
    }

    .hud-frame::before,
    .hud-frame::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      border: 2px solid var(--blue);
      filter: drop-shadow(0 0 6px var(--blue-glow));
    }

    .hud-frame::before {
      top: -2px;
      left: -2px;
      border-right: none;
      border-bottom: none;
    }

    .hud-frame::after {
      bottom: -2px;
      right: -2px;
      border-left: none;
      border-top: none;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 640px;
      width: 100%;
    }

    .hologram-title {
      position: relative;
      display: inline-block;
      margin: 0 auto 10px;
      padding: 16px 40px;
      border: 1px solid rgba(0, 180, 255, 0.5);
      background: rgba(0, 180, 255, 0.05);
      box-shadow: 0 0 20px var(--blue-glow), inset 0 0 25px rgba(0, 180, 255, 0.07);
      overflow: hidden;
      clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    }

    .hologram-title span[data-text] {
      position: relative;
      display: inline-block;
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--blue);
      text-shadow: 0 0 6px var(--blue-glow), 0 0 18px var(--blue-glow);
      animation: flicker 4s infinite;
    }

    .hologram-title span[data-text]::before,
    .hologram-title span[data-text]::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      opacity: 0;
      filter: blur(0.5px);
    }

    .hologram-title span[data-text]::before {
      color: var(--cyan-ghost);
      animation: glitchBefore 3.2s infinite;
      clip-path: inset(0 0 55% 0);
    }

    .hologram-title span[data-text]::after {
      color: var(--violet-ghost);
      animation: glitchAfter 3.2s infinite;
      clip-path: inset(55% 0 0 0);
    }

    .hologram-title .scan-line {
      position: absolute;
      left: 4%;
      width: 92%;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--blue), transparent);
      filter: blur(1px) drop-shadow(0 0 6px var(--blue));
      top: 0;
      animation: scan 2.4s linear infinite;
    }

    @keyframes flicker {

      0%,
      92%,
      100% {
        opacity: 1;
      }

      93% {
        opacity: 0.55;
      }

      94% {
        opacity: 1;
      }

      95% {
        opacity: 0.35;
      }

      96% {
        opacity: 1;
      }
    }

    @keyframes glitchBefore {

      0%,
      88%,
      100% {
        opacity: 0;
        transform: translateX(0);
      }

      90% {
        opacity: 0.7;
        transform: translateX(-3px);
      }

      92% {
        opacity: 0;
      }
    }

    @keyframes glitchAfter {

      0%,
      88%,
      100% {
        opacity: 0;
        transform: translateX(0);
      }

      90% {
        opacity: 0.6;
        transform: translateX(3px);
      }

      92% {
        opacity: 0;
      }
    }

    @keyframes scan {
      0% {
        top: 0;
      }

      100% {
        top: 100%;
      }
    }

    .subtitle {
      color: var(--ink-dim);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 18px 0 16px;
    }

    #cache-status {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 7px 14px;
      border: 1px solid var(--blue-dim);
      background: rgba(0, 180, 255, 0.04);
      color: var(--ink-dim);
      margin: 0 0 22px;
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: color 0.4s, border-color 0.4s;
    }
    #cache-status.ok  { color: #7fd0a0; border-color: #7fd0a0; text-shadow: 0 0 6px rgba(127,208,160,0.4); }
    #cache-status.warn{ color: var(--blue); border-color: var(--blue); text-shadow: 0 0 6px var(--blue-glow); }
    #cache-status.err { color: #d08a7f; border-color: #d08a7f; }
    #cache-status .dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: currentColor;
      animation: blink 1s step-start infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .btn-exploit[disabled], .btn-exploit[aria-disabled="true"] {
      opacity: 0.4;
      pointer-events: none;
      cursor: not-allowed;
    }

    .exploit-card {
      position: relative;
      padding: 28px 30px;
      border: 2px solid var(--blue);
      background: rgba(0, 180, 255, 0.05);
      box-shadow: 0 0 20px var(--blue-glow), inset 0 0 15px rgba(0, 180, 255, 0.05);
      text-align: left;
      overflow: hidden;
      border-radius: 3px;
      margin-bottom: 20px;
    }

    .exploit-card .scan-bar {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--blue), transparent);
      filter: blur(.5px);
      animation: scan 3s linear infinite;
      pointer-events: none;
    }

    .exploit-card .fw-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--cyan-ghost);
      text-shadow: 0 0 6px rgba(0, 255, 247, 0.4);
      margin-bottom: 8px;
      display: block;
    }

    .exploit-card h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--blue);
      text-shadow: 0 0 6px var(--blue-glow);
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .exploit-card p {
      font-size: 12px;
      color: var(--ink-dim);
      letter-spacing: 1px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .btn-exploit {
      display: inline-block;
      position: relative;
      padding: 12px 28px;
      border: 2px solid var(--blue);
      background: rgba(0, 180, 255, 0.08);
      color: var(--blue);
      text-decoration: none;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      box-shadow: 0 0 15px var(--blue-glow);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .btn-exploit::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(0, 180, 255, 0.2), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }

    .btn-exploit:hover::before {
      transform: translateX(100%);
    }

    .btn-exploit:hover {
      background: rgba(0, 180, 255, 0.15);
      box-shadow: 0 0 30px var(--blue-glow), 0 0 60px rgba(0, 180, 255, 0.1);
      transform: translateY(-1px);
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 30px;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--ink-dim);
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <div class="hud-frame"></div>

  <main>
    <h1 class="hologram-title">
      <span class="scan-line"></span>
      <span data-text="NEXPHYRIX">NEXPHYRIX</span>
    </h1>
    <p class="subtitle">PS4 Exploit Host — Firmware 11.00 – 13.00</p>

    <div class="exploit-card" id="exploit-lapse">
      <div class="scan-bar"></div>
      <span class="fw-label">// Exploit Node — Lapse Chain</span>
      <h2>LAPSE CHAIN EXPLOIT</h2>
      <p>WebKit-based exploit chain targeting PS4 firmware ≤ 12.02.<br>
        Initiates kernel access via Lapse method with full payload staging.</p>
      <a href="run_lapse.html" class="btn-exploit" id="btn-lapse">&gt; Launch Lapse</a>
    </div>
  </main>

  <div id="cache-status"><span class="dot"></span>&nbsp;CHECKING CACHE...</div>

  <footer>© <span id="footer-year"></span> NEXPHYRIX — 087-777-747-477</footer>

  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();

    // ─── applicationCache handler ───────────────────────────────────────
    (function () {
      var el   = document.getElementById('cache-status');
      var btn  = document.getElementById('btn-lapse');

      function setStatus(msg, cls) {
        el.innerHTML = '<span class="dot"></span>&nbsp;' + msg;
        el.className = cls || '';
      }
      function unlock() {
        if (btn) btn.removeAttribute('aria-disabled');
      }
      // Kunci tombol dulu sampai cache siap
      if (btn) btn.setAttribute('aria-disabled', 'true');

      var ac = window.applicationCache;
      if (!ac || !document.documentElement.hasAttribute('manifest')) {
        setStatus('CACHE NOT SUPPORTED — ONLINE ONLY', 'warn');
        unlock();
        return;
      }

      if (!navigator.onLine) {
        setStatus('OFFLINE — RUNNING FROM CACHE', 'ok');
        unlock();
        return;
      }

      if (ac.status === ac.IDLE || ac.status === ac.UPDATEREADY) {
        if (ac.status === ac.UPDATEREADY) { try { ac.swapCache(); } catch(e) {} }
        setStatus('CACHED — OFFLINE READY ✓', 'ok');
        unlock();
        return;
      }

      setStatus('CHECKING CACHE...');

      ac.addEventListener('checking',    function () { setStatus('CHECKING CACHE...'); }, false);
      ac.addEventListener('downloading', function () { setStatus('CACHING FOR OFFLINE (FIRST RUN)...', 'warn'); }, false);
      ac.addEventListener('progress', function (e) {
        var pct = (e && e.total > 0) ? Math.round((e.loaded / e.total) * 100) + '%' : '';
        setStatus('CACHING... ' + pct, 'warn');
      }, false);
      ac.addEventListener('cached', function () {
        setStatus('CACHED — OFFLINE READY ✓', 'ok'); unlock();
      }, false);
      ac.addEventListener('noupdate', function () {
        setStatus('CACHED — OFFLINE READY ✓', 'ok'); unlock();
      }, false);
      ac.addEventListener('updateready', function () {
        try { ac.swapCache(); } catch(e) {}
        setStatus('UPDATE DOWNLOADED – RELOAD TO APPLY', 'ok'); unlock();
      }, false);
      ac.addEventListener('error', function () {
        setStatus('CACHE ERROR — ONLINE ONLY', 'err'); unlock();
      }, false);
      ac.addEventListener('obsolete', function () {
        setStatus('CACHE OBSOLETE', 'err'); unlock();
      }, false);
    })();
  </script>
</body>

</html>
